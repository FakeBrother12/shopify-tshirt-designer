services:
  - type: web
    name: shopify-tshirt-designer
    runtime: node
    plan: starter
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm run start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: SHOPIFY_APP_URL
        sync: false
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SCOPES
        value: read_products,write_draft_orders
      - key: DATABASE_URL
        fromDatabase:
          name: tshirt-designer-db
          property: connectionString
databases:
  - name: tshirt-designer-db
    plan: basic-256mb
    databaseName: tshirtdesigner
    user: tshirtdesigner
